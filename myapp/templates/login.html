{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCAD CodeQuest - Login</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
</head>
<body class="bg-slate-900 font-sans flex flex-col justify-center items-center h-screen m-0">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl text-center max-w-sm w-full mx-4 border border-red-900/50">
        <h1 class="text-3xl font-extrabold text-red-500 mb-2">JCAD CodeQuest 🎮</h1>
        <p class="text-slate-400 text-sm mb-6">Enter your credentials to continue your coding quest.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 text-sm text-red-300 bg-red-900/30 border border-red-800 rounded-lg px-4 py-2 text-left">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4 text-left">
                <label class="text-slate-300 text-xs font-semibold block mb-2">USERNAME</label>
                <input type="text" name="username" placeholder="Enter username" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-red-500" required>
            </div>

            <div class="mb-2 text-left">
                <label class="text-slate-300 text-xs font-semibold block mb-2">PASSWORD</label>
                <input type="password" name="password" placeholder="Enter password" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-red-500" required>
            </div>

            <p class="text-right mb-4">
                <a href="{% url 'forgot_password_request' %}" class="text-red-400 hover:underline text-xs">Forgot password?</a>
            </p>

            <button type="submit" class="w-full bg-red-600 text-white font-bold py-2.5 rounded-lg hover:bg-red-700 transition shadow-lg shadow-red-600/20">
                Login to Dashboard
            </button>
        </form>
        <p class="text-slate-400 text-xs mt-6">
            New to JCAD CodeQuest? <a href="/register/" class="text-red-400 hover:underline font-semibold">Create an Account</a>
        </p>

    </div>

</body>
</html>
