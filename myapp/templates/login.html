{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCAD CodeQuest - Login</title>
    <style>
        :root {
            --maroon: #8b1126;
            --maroon-dark: #6e0d1e;
            --input-bg: #e8f0fe;
            --input-border: #c9d7f5;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f1f1f4;
            color: #1f2937;
            position: relative;
            overflow-x: hidden;
        }
        /* maroon left half with big faded seal, like the school portal */
        .bg-left {
            position: fixed; inset: 0 auto 0 0; width: 50%;
            background: var(--maroon);
            overflow: hidden;
        }
        .bg-left img {
            position: absolute; top: 50%; left: 50%;
            width: min(70vh, 520px); transform: translate(-70%, -50%);
            opacity: .3;
        }
        .wrap {
            position: relative; z-index: 1;
            min-height: 100%; display: flex; align-items: center; justify-content: center;
            padding: 24px 16px;
        }
        .card {
            background: #fff; width: 100%; max-width: 440px;
            border-radius: 14px; padding: 32px 36px 28px;
            box-shadow: 0 10px 40px rgba(0,0,0,.18);
            text-align: center;
        }
        .logo { width: 108px; height: 108px; display: block; margin: 0 auto 10px; }
        h1 { font-size: 26px; font-weight: 500; letter-spacing: .5px; margin: 6px 0 2px; color: #222; }
        .sub { font-size: 13px; color: #6b7280; margin: 0 0 20px; }
        .msg {
            text-align: left; font-size: 13px; margin-bottom: 14px; padding: 9px 12px;
            border-radius: 8px; color: #7f1d1d; background: #fde8ea; border: 1px solid #f5b5bd;
        }
        form { text-align: left; }
        label { font-size: 11px; font-weight: 700; letter-spacing: .6px; color: #4b5563; display: block; margin: 0 0 6px; }
        input[type=text], input[type=password] {
            width: 100%; padding: 11px 12px; font-size: 14px; margin-bottom: 14px;
            background: var(--input-bg); border: 1px solid var(--input-border);
            border-radius: 6px; color: #111; outline: none;
        }
        input:focus { border-color: var(--maroon); box-shadow: 0 0 0 3px rgba(139,17,38,.15); }
        .forgot { text-align: right; margin: -4px 0 14px; }
        .forgot a { font-size: 12.5px; color: var(--maroon); text-decoration: none; }
        .forgot a:hover, .signup a:hover { text-decoration: underline; }
        button {
            width: 100%; padding: 12px; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer;
            background: var(--maroon); border: 0; border-radius: 22px; transition: background .15s;
        }
        button:hover { background: var(--maroon-dark); }
        .signup { text-align: center; font-size: 13px; color: #6b7280; margin: 20px 0 0; }
        .signup a { color: var(--maroon); font-weight: 600; text-decoration: none; }
        @media (max-width: 720px) {
            .bg-left { width: 100%; height: 38%; inset: 0 0 auto 0; }
            .bg-left img { width: 320px; transform: translate(-50%, -40%); }
            .wrap { align-items: flex-start; padding-top: 48px; }
            .card { padding: 26px 22px 22px; }
        }
    </style>
</head>
<body>
    <div class="bg-left"><img src="{% static 'img/logo.png' %}" alt=""></div>

    <div class="wrap">
        <div class="card">
            <img class="logo" src="{% static 'img/logo.png' %}" alt="Colegio de San Gabriel Arcangel seal">
            <h1>LOGIN</h1>
            <p class="sub">JCAD CodeQuest &middot; Java Programming</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="msg">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <label for="username">USERNAME</label>
                <input id="username" type="text" name="username" placeholder="Enter username" autocomplete="username" required>

                <label for="password">PASSWORD</label>
                <input id="password" type="password" name="password" placeholder="Enter password" autocomplete="current-password" required>

                <p class="forgot"><a href="{% url 'forgot_password_request' %}">Forgot password?</a></p>

                <button type="submit">Login</button>
            </form>

            <p class="signup">New to JCAD CodeQuest? <a href="/register/">Create an Account</a></p>
        </div>
    </div>
{% include 'password_toggle.html' %}
</body>
</html>
