{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <a href="{% url 'quizzes' %}" class="text-sm text-slate-500 hover:text-red-700">
        <i class="fa-solid fa-arrow-left"></i> Back to Quizzes
    </a>

    <div class="bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
        <h1 class="text-2xl font-extrabold text-slate-800 mb-1">{{ quiz.title }}</h1>
        <p class="text-slate-500 text-sm mb-6">{{ quiz.description }}</p>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            {% for question in questions %}
                <div class="border-t border-slate-100 pt-5">
                    <p class="font-semibold text-slate-800 mb-3">{{ forloop.counter }}. {{ question.text }}</p>
                    <div class="space-y-2">
                        {% for choice in question.choices.all %}
                            <label class="flex items-center gap-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg px-4 py-2.5 cursor-pointer text-sm text-slate-700">
                                <input type="radio" name="question_{{ question.id }}" value="{{ choice.id }}" required>
                                {{ choice.text }}
                            </label>
                        {% endfor %}
                    </div>
                </div>
            {% endfor %}

            <button type="submit"
                class="w-full bg-red-700 text-white font-semibold py-3 rounded-lg hover:bg-red-800 transition">
                Submit Answers
            </button>
        </form>
    </div>
</div>
{% endblock %}
