{% comment %} Eye-icon show/hide button for every password field on the page. Include once, near the end of the page. {% endcomment %}
<style>
    .pw-wrap { position: relative; display: block; }
    .pw-wrap > input { padding-right: 46px !important; }
    .pw-eye {
        position: absolute; right: 0; width: 44px; display: flex; align-items: center; justify-content: center;
        background: transparent; border: 0; padding: 0; cursor: pointer; color: #6b7280; border-radius: 0 8px 8px 0;
        width: 44px; min-height: 40px; box-shadow: none;
    }
    .pw-eye:hover { color: #111827; background: transparent; }
    .pw-eye:focus-visible { outline: 2px solid #8b1126; outline-offset: -2px; }
    .pw-eye svg { width: 20px; height: 20px; display: block; }
</style>
<script>
(function () {
    var EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

    function enhance(input) {
        if (input.dataset.pwToggle) { return; }
        input.dataset.pwToggle = "1";
        var wrap = document.createElement("div");
        wrap.className = "pw-wrap";
        input.parentNode.insertBefore(wrap, input);
        wrap.appendChild(input);

        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "pw-eye";
        btn.setAttribute("aria-label", "Show password");
        btn.setAttribute("aria-pressed", "false");
        btn.innerHTML = EYE;
        wrap.appendChild(btn);

        function place() {
            // Line the button up with the input itself (ignores margins / hint text below it).
            var h = input.offsetHeight || 40;
            btn.style.top = input.offsetTop + "px";
            btn.style.height = h + "px";
        }
        place();
        window.addEventListener("resize", place);
        window.addEventListener("load", place);

        btn.addEventListener("click", function () {
            var showing = input.type === "text";
            input.type = showing ? "password" : "text";   // display only; the value is never stored by the browser page
            btn.innerHTML = showing ? EYE : EYE_OFF;
            btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
            btn.setAttribute("aria-pressed", showing ? "false" : "true");
            input.focus();
        });
    }

    function run() {
        var list = document.querySelectorAll('input[type="password"]');
        for (var i = 0; i < list.length; i++) { enhance(list[i]); }
    }
    if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", run); } else { run(); }
})();
</script>
