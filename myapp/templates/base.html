<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEARNING SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-red-800 text-white flex flex-col justify-between flex-shrink-0">
        <div>
            <div class="p-6 flex items-center gap-3 border-b border-red-700">
                <span class="text-2xl"><i class="fa-solid fa-bars"></i></span>
                <span class="font-bold tracking-wider text-sm">LEARNING SYSTEM</span>
            </div>
            <nav class="p-4 space-y-1">
                <a href="{% url 'home' %}" class="flex items-center gap-4 px-4 py-3 {% if request.resolver_match.url_name == 'home' %}bg-red-900{% else %}hover:bg-red-700/50{% endif %} rounded-xl text-sm font-semibold text-red-100">
                    <i class="fa-solid fa-house w-5 text-center"></i> Dashboard
                </a>
                <a href="{% url 'lessons' %}" class="flex items-center gap-4 px-4 py-3 {% if request.resolver_match.url_name == 'lessons' or request.resolver_match.url_name == 'lesson_detail' %}bg-red-900{% else %}hover:bg-red-700/50{% endif %} rounded-xl text-sm text-red-100">
                    <i class="fa-solid fa-book-open w-5 text-center"></i> Lessons
                </a>
                <a href="{% url 'quizzes' %}" class="flex items-center gap-4 px-4 py-3 {% if request.resolver_match.url_name == 'quizzes' or request.resolver_match.url_name == 'quiz_detail' %}bg-red-900{% else %}hover:bg-red-700/50{% endif %} rounded-xl text-sm text-red-100">
                    <i class="fa-solid fa-pen-to-square w-5 text-center"></i> Quizzes
                </a>
                <a href="{% url 'badges' %}" class="flex items-center gap-4 px-4 py-3 {% if request.resolver_match.url_name == 'badges' %}bg-red-900{% else %}hover:bg-red-700/50{% endif %} rounded-xl text-sm text-red-100">
                    <i class="fa-solid fa-trophy w-5 text-center"></i> Badges
                </a>
                <a href="{% url 'profile' %}" class="flex items-center gap-4 px-4 py-3 {% if request.resolver_match.url_name == 'profile' or request.resolver_match.url_name == 'edit_profile' %}bg-red-900{% else %}hover:bg-red-700/50{% endif %} rounded-xl text-sm text-red-100">
                    <i class="fa-solid fa-user w-5 text-center"></i> My Profile
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-red-700">
            <a href="{% url 'logout' %}" class="flex items-center gap-4 px-4 py-3 hover:bg-red-900 rounded-xl text-sm font-semibold text-red-100">
                <i class="fa-solid fa-right-from-bracket w-5 text-center"></i> Logout
            </a>
        </div>
    </aside>

    <!-- Content Area -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8">
            <div class="font-bold text-slate-800 text-sm">Welcome, {{ request.user.username }}</div>
        </header>

        <main class="flex-1 overflow-y-auto p-8">
            {% if messages %}
                <div class="mb-4 space-y-2">
                    {% for message in messages %}
                        <div class="px-4 py-3 rounded-lg text-sm font-medium
                            {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200
                            {% else %}bg-emerald-50 text-emerald-700 border border-emerald-200{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            {% block content %}
            <!-- Other pages will inject their HTML here -->
            {% endblock %}
        </main>
    </div>
</body>
</html>
