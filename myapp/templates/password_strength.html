{# Live password-strength indicator. Usage: {% include 'password_strength.html' with input_id='id_password' %} #}
<div class="mt-2 text-left" data-strength-for="{{ input_id }}">
    <div style="height:6px;border-radius:9999px;background-color:#475569;overflow:hidden;">
        <div class="pw-bar" style="height:100%;width:0%;background-color:#475569;transition:width .2s ease,background-color .2s ease;"></div>
    </div>
    <p class="pw-label text-xs font-semibold mt-1" style="min-height:1rem;"></p>
    <p class="text-xs mt-1" style="color:#94a3b8;">
        Use at least 8 characters with an uppercase letter, a lowercase letter, a number, and a special character.
    </p>
</div>
<script>
(function () {
    var input = document.getElementById("{{ input_id }}");
    if (!input) { return; }
    var wrap = document.querySelector('[data-strength-for="{{ input_id }}"]');
    var bar = wrap.querySelector(".pw-bar");
    var label = wrap.querySelector(".pw-label");

    // Same rules as password_strength() in forms.py, so what the user sees
    // is exactly what the server will accept.
    function strengthOf(pw) {
        var kinds = 0;
        if (/[a-z]/.test(pw)) { kinds++; }
        if (/[A-Z]/.test(pw)) { kinds++; }
        if (/[0-9]/.test(pw)) { kinds++; }
        if (/[^A-Za-z0-9]/.test(pw)) { kinds++; }
        if (pw.length < 8 || kinds <= 2) { return "Weak"; }
        if (kinds === 3) { return "Medium"; }
        return "Strong";
    }

    var LOOK = {
        "Weak":   { color: "#ef4444", width: "33%" },
        "Medium": { color: "#eab308", width: "66%" },
        "Strong": { color: "#22c55e", width: "100%" }
    };

    function update() {
        var pw = input.value;
        if (!pw) {
            label.textContent = "";
            bar.style.width = "0%";
            return;
        }
        var level = strengthOf(pw);
        label.textContent = "Password strength: " + level;
        label.style.color = LOOK[level].color;
        bar.style.backgroundColor = LOOK[level].color;
        bar.style.width = LOOK[level].width;
    }

    input.addEventListener("input", update);
    update();
})();
</script>
