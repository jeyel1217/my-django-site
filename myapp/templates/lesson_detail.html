{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <a href="{% url 'lessons' %}" class="text-sm text-slate-500 hover:text-red-700">
        <i class="fa-solid fa-arrow-left"></i> Back to Lessons
    </a>

    <div class="bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
        <span class="inline-block text-[10px] font-bold tracking-wider text-red-700 bg-red-50 px-2 py-1 rounded mb-3">
            LESSON {{ lesson.order }}
        </span>
        <h1 class="text-2xl font-extrabold text-slate-800 mb-6">{{ lesson.title }}</h1>

        <div class="prose prose-slate max-w-none text-slate-600 leading-relaxed">
            {{ lesson.content|linebreaks }}
        </div>

        <div class="mt-8 pt-6 border-t border-slate-100">
            {% if progress.completed %}
                <span class="inline-flex items-center gap-2 text-emerald-600 font-semibold text-sm">
                    <i class="fa-solid fa-circle-check"></i> Completed
                </span>
            {% else %}
                <form method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="mark_complete">
                    <button type="submit"
                        class="bg-red-700 text-white font-semibold px-5 py-2.5 rounded-lg hover:bg-red-800 transition text-sm">
                        Mark as Complete
                    </button>
                </form>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
